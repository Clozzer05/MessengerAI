# Chạy production trên một máy: Caddy nhận cổng 80/443 (tự cấp HTTPS) rồi chuyển vào các container.
# Các biến (DOMAIN, JWT_SECRET, GROQ_API_KEY...) đọc từ file .env cùng thư mục với file này.
# Image được GitHub Actions build và đẩy lên GHCR (.github/workflows/ci-cd.yml), server chỉ kéo về qua deploy.sh.
# Build tay trên máy: docker compose -f docker-compose.prod.yml up -d --build

x-build-labels: &build-labels
  org.opencontainers.image.source: https://github.com/Clozzer05/MessengerAI

services:
  # ─── Caddy (HTTPS + reverse proxy, cấu hình trong Caddyfile) ─────────
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?Cần đặt DOMAIN trong .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - skyoffice-client
      - skyoffice-server
    restart: unless-stopped

  # ─── MongoDB (không mở cổng ra ngoài) ────────────────────────────────
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # ─── Backend (Chat API + Socket.io) ───────────────────────────────────
  backend:
    image: ghcr.io/clozzer05/messengerai-backend:latest
    build:
      context: ./smart-ai/backend
      labels: *build-labels
    env_file:
      - ./.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/smart_ai_chat
      - JWT_SECRET=${JWT_SECRET:?Cần đặt JWT_SECRET trong .env}
      - CORS_ORIGINS=https://${DOMAIN}
      - CORS_ORIGIN_PATTERNS=https://${DOMAIN}
      - PUBLIC_BASE_URL=https://${DOMAIN}
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  # ─── SkyOffice Game Server (Colyseus 0.14) ────────────────────────────
  skyoffice-server:
    image: ghcr.io/clozzer05/messengerai-skyoffice-server:latest
    build:
      context: ./SkyOffice
      dockerfile: Dockerfile.server
      labels: *build-labels
    environment:
      - PORT=2567
      - NODE_ENV=production
    restart: unless-stopped

  # ─── SkyOffice Client (Phaser + React, served by Nginx) ───────────────
  skyoffice-client:
    image: ghcr.io/clozzer05/messengerai-skyoffice-client:latest
    build:
      context: ./SkyOffice
      dockerfile: Dockerfile.client
      labels: *build-labels
      args:
        - VITE_SERVER_URL=wss://office-server.${DOMAIN}
    restart: unless-stopped

  # ─── Frontend (Chat App, nginx proxy /api, /socket.io, /uploads sang backend) ─
  frontend:
    image: ghcr.io/clozzer05/messengerai-frontend:latest
    build:
      context: ./smart-ai/frontend
      labels: *build-labels
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
        - VITE_SKYOFFICE_URL=https://office.${DOMAIN}
    depends_on:
      - backend
    restart: unless-stopped

  # ─── TURN server cho cuộc gọi WebRTC (coturn) ──────────────────────────
  # Dùng mạng của máy (network_mode: host) vì phải mở cả dải cổng UDP để relay.
  # Backend cấp mật khẩu tạm từ TURN_SECRET (xem /api/ice-servers). Security group cần mở:
  # UDP+TCP 3478 và UDP 49160-49200.
  coturn:
    image: coturn/coturn:4.18
    network_mode: host
    command:
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${TURN_EXTERNAL_IP:?Cần đặt TURN_EXTERNAL_IP (IP public/IP nội bộ) trong .env}
      - --realm=${DOMAIN}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?Cần đặt TURN_SECRET trong .env}
      - --fingerprint
      - --no-tls
      - --no-multicast-peers
      # Không cho relay vào mạng nội bộ của AWS và địa chỉ đặc biệt
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --log-file=stdout
    restart: unless-stopped

volumes:
  mongo-data:
  backend-uploads:
  caddy-data:
  caddy-config:
